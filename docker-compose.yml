services:
  postgres:
    image: postgres:16-alpine
    container_name: klaatzoo-db
    environment:
      POSTGRES_DB: klaatzoo
      POSTGRES_USER: klaatzoo
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
